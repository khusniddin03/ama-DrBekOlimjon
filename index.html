<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Savol-javob</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* Mavzuni birinchi chizishdan oldin qo'llaymiz — oq ekran chaqnashi bo'lmasligi uchun. */
  try {
    var t = localStorage.getItem('ama-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}

  /* Vercel Web Analytics — tashrifchilar hisobi.
     Skript ham, yuboriladigan ma'lumot ham /_vercel/... yo'li orqali, ya'ni
     saytning o'z domenida ketadi: begona hostga bitta ham so'rov bormaydi.
     Lokal ishlaganda (localhost yoki file://) umuman yuklanmaydi. */
  if (location.protocol === 'https:' || location.protocol === 'http:') {
    if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      var s = document.createElement('script');
      s.defer = true;
      s.src = '/_vercel/insights/script.js';
      document.head.appendChild(s);
    }
  }
</script>
</head>
<body>

<a class="skip" href="#savollar">Asosiy qismga o'tish</a>

<h1 class="sr-only" id="top">Savol-javob</h1>

<div id="sentinel" aria-hidden="true"></div>

<div class="searchwrap" id="searchwrap">
  <div class="searchwrap-in">
   <div class="topbar">
    <form role="search" id="searchform" class="field">
      <label class="field-row" for="q">
        <span class="sr-only">Savollar bo'yicha qidirish</span>
        <svg class="ico-search" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
          <line x1="10.8" y1="10.8" x2="15" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Savol yoki kalit so'z yozing…">
        <span class="count-inline" id="count-inline" aria-hidden="true"></span>
        <span class="kbd" id="kbdhint" aria-hidden="true">/</span>
        <button type="button" id="clear" class="clear" aria-label="Qidiruvni tozalash" hidden>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
            <line x1="1.2" y1="1.2" x2="10.8" y2="10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="10.8" y1="1.2" x2="1.2" y2="10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </label>
    </form>

    <button type="button" id="fav-btn" class="iconbtn" aria-pressed="false"
            aria-label="Saqlanganlarni ko'rsatish" hidden>
      <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M10 2.6l2.32 4.7 5.18.75-3.75 3.66.89 5.16L10 14.43l-4.64 2.44.89-5.16L2.5 8.05l5.18-.75z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>

    <div class="dl" id="dl">
      <button type="button" id="dl-btn" class="iconbtn" aria-label="Yuklab olish"
              aria-haspopup="menu" aria-expanded="false" aria-controls="dl-menu">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
          <path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 14.5v1A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="dl-menu" id="dl-menu" role="menu" aria-labelledby="dl-btn" hidden>
        <p class="dl-head" id="dl-head"></p>
        <button type="button" role="menuitem" data-fmt="docx">Word <span>.docx</span></button>
        <button type="button" role="menuitem" data-fmt="pdf">PDF <span>chop etish</span></button>
        <button type="button" role="menuitem" data-fmt="xlsx">Excel <span>.xlsx</span></button>
        <button type="button" role="menuitem" data-fmt="json">JSON <span>.json</span></button>
      </div>
    </div>

    <button type="button" id="theme" class="iconbtn theme" aria-label="Yorug' rejimga o'tish"></button>
   </div>
    <p class="status" id="status-visible" aria-hidden="true"></p>
    <p class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</div>

<div class="page">
  <nav class="rail" id="rail" aria-label="Savollar ro'yxati">
    <p class="rail-head" id="rail-head">SAVOLLAR</p>
    <div id="rail-list"></div>
  </nav>

  <main class="col">
    <ol id="savollar" tabindex="-1"></ol>

    <div id="empty" hidden>
      <svg class="ico-empty" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="7.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="16.5" y1="16.5" x2="23" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7.5" y1="14.5" x2="14.5" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="empty-title">Hech narsa topilmadi</p>
      <p class="empty-body" id="empty-body"></p>
      <p class="chips-head">MAVZULAR</p>
      <div class="chips" id="chips"></div>
      <button type="button" class="linkbtn" id="empty-clear">Qidiruvni tozalash</button>
    </div>

    <div id="boot-error" hidden>
      <p class="empty-title">Ma'lumotni o'qib bo'lmadi</p>
      <p class="empty-body" id="boot-error-body"></p>
    </div>
  </main>
</div>

<footer class="footer">
  <div class="footer-in">
    <p id="foot-total"></p>
    <a class="uplink" href="#top">Yuqoriga
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
        <path d="M2.5 7.5 6 4l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</footer>

<div id="sentinel-top" aria-hidden="true"></div>

<button type="button" id="totop" class="totop" aria-label="Yuqoriga" hidden>
  <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
    <path d="M4 12l6-6 6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<noscript>
  <div class="noscript">Bu sahifa ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</div>
</noscript>

<script src="app.js"></script>
</body>
</html>
